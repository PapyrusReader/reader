name: Reader CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: bash tool/build_epub_worker.sh --check
      - run: dart format --output=none --set-exit-if-changed lib test example/lib example/test tool
      - run: flutter analyze
      - run: flutter test
      - run: flutter analyze
        working-directory: example
      - run: flutter test
        working-directory: example
      - run: flutter build web
        working-directory: example
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: tool/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tool/browser
      - run: npm test
        working-directory: tool/browser

  desktop-build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
        if: matrix.target == 'linux'
      - run: flutter pub get
        working-directory: example
      - run: flutter build ${{ matrix.target }}
        if: matrix.target != 'macos'
        working-directory: example
      - run: flutter build macos --config-only --release
        if: matrix.target == 'macos'
        working-directory: example
      # Flutter 3.41.2's universal build has an Xcode 27 architecture-check issue.
      # Compile the runner architecture until flutter/flutter#188346 is fixed.
      - run: >-
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner
          -configuration Release -derivedDataPath build/macos -sdk macosx
          ARCHS=$(uname -m) ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
        if: matrix.target == 'macos'
        working-directory: example
