name: Reader CI

on:
  push:
    branches: [development, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed bin lib test example/lib example/test tool
      - run: flutter analyze
      - run: flutter test
      - run: flutter analyze
        working-directory: example
      - run: flutter test
        working-directory: example
      - run: flutter build web
        working-directory: example
      - run: python3 tool/check_worker_build.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: tool/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tool/browser
      - run: npm test
        working-directory: tool/browser

  desktop-build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
        if: matrix.target == 'linux'
      - run: flutter pub get
        working-directory: example
      - run: flutter build ${{ matrix.target }}
        working-directory: example
