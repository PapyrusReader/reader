name: papyrus_reader
description: "Extensible cross-platform EPUB and PDF reader for Papyrus."
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.9.2 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  archive: ^4.0.7
  characters: ^1.4.1
  kindle_unpack:
    path: third_party/kindle_unpack
  epub_pro: ^5.6.0
  flutter:
    sdk: flutter
  flutter_html: ^3.0.0
  # flutter_html 3.0.0 uses the private matches API removed in html 0.15.7.
  html: 0.15.6
  # pdf 3.12 requires archive <4.1; image 4.10+ uses newer archive APIs.
  image: ">=4.3.0 <4.10.0"
  koni_archive_core: ^0.9.0
  koni_rar: ^0.9.0
  pdf: ^3.11.3
  pdfrx: ^2.12.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - path: assets/epub_worker
      platforms: [web]
      transformers:
        - package: papyrus_reader:compile_epub_worker
