name: papyrus_reader
description: "Extensible cross-platform EPUB and PDF reader for Papyrus."
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.9.2 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  characters: ^1.4.1
  epub_pro: ^5.6.0
  flutter:
    sdk: flutter
  flutter_html: ^3.0.0
  # flutter_html 3.0.0 uses the private matches API removed in html 0.15.7.
  html: 0.15.6
  # 2.4.8 requires meta 1.18, conflicting with Flutter 3.41.2's SDK pin.
  pdfrx: ^2.4.7
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/epub_worker.js
    - assets/epub_worker.NOTICES
